name: Clean up packages

# Removes images from ghcr.io that are no longer needed:
#   - untagged images (old builds whose tags moved on), multi-arch aware:
#     platform images and attestations of tagged images are kept
#   - sha-* tags
# Release images (YYYYMMDD, v*), latest and master are never deleted.
# Only images older than 30 days are touched.

on:
  # Weekly, two hours after the rebuild in docker-publish.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: jenkins
          delete-untagged: true
          delete-tags: 'sha-*'
          exclude-tags: 'latest,master,2*,v*'
          older-than: 30 days
          validate: true
          # Scheduled runs delete, manual runs default to a dry run
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
